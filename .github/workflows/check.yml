name: Otaru cruise availability check

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otaru-cruise-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check availability
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python watcher.py

      - name: Save notification state
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json に変更なし"
            exit 0
          fi
          git config user.name "otaru-cruise-watcher[bot]"
          git config user.email "otaru-cruise-watcher[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update cruise availability state"
          git push
